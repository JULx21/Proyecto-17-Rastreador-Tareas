<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 17 : Rastreador Tareas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Rastreador de Tareas</h1>

        <!-- Formulario: se envia con Enter o con el boton -->
        <form id="formulario">
            <input type="text" id="inputTarea" placeholder="Inicie escribiendo y presione enter para crear tareas">
            <button type="submit">↵</button>
        </form>

        <!-- Aqui JavaScript va a pintar las tareas -->
        <ul id="listaTareas"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
